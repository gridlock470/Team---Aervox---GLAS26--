[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcast"
version = "0.1.0"
description = "AI-driven hyperlocal severe-weather nowcasting — SIH prototype (ML + inference track)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["nowcast"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# Test files may use assert and re-import fixtures freely.
per-file-ignores = { "tests/*" = ["F401", "F811"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
