# Small ConvLSTM nowcasting config -- CPU-friendly smoke / baseline run.
data:
  source: synthetic          # "real" -> set features/labels/terrain paths below
  n_hours: 90
  batch_size: 4
  # For source != synthetic:
  # features: data/processed/features.zarr
  # labels: data/processed/labels.nc
  # terrain: data/processed/dem_routing.zarr   # default: config.DEM_ROUTING_PATH
  # norm_stats_path: data/processed/norm_stats.json

model:
  backbone:
    in_channels: 20
    hidden: 16
    depth: 2
  lr: 3.0e-4
  weight_decay: 1.0e-4
  bce_weight: 1.0
  dice_weight: 0.5
  focal_weight: 0.0          # > 0 adds a focal-loss term for rare-class emphasis
  hazard_weights:
    thunderstorm: 1.0
    cloudburst: 1.0
    flash_flood: 1.0

trainer:
  max_epochs: 20
  log_every_n_steps: 10
